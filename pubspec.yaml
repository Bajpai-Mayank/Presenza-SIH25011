name: presenza
description: "Smart Circular — Attendance & Activity Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^6.5.2
  firebase_database: ^12.4.7

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI & Animations
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # Location
  geolocator: ^13.0.2

  # Camera
  camera: ^0.11.1

  # Local Storage
  shared_preferences: ^2.5.3
  # Firebase Storage & Messaging
  firebase_storage: ^12.1.2
  firebase_messaging: ^15.0.2
  # Image picker & colour picker UI
  image_picker: ^1.0.7
  flutter_colorpicker: ^1.0.4


  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.png
