name: presenza
description: "Smart Circular — Attendance & Activity Management"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9

  # Supabase & Env
  supabase_flutter: ^2.5.4
  flutter_dotenv: ^5.1.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI & Animations
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # Location
  geolocator: ^13.0.2

  # Camera
  camera: ^0.11.1

  # Local Storage
  shared_preferences: ^2.5.3

  # Image picker & colour picker UI
  image_picker: ^1.2.3
  flutter_colorpicker: ^1.0.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.0
  flutter_image_compress: ^2.5.1
  firebase_storage: ^12.4.10
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/icon_adaptive_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.png
    - assets/images/icon_adaptive_foreground.png
    - assets/images/logo.png
    - assets/images/logo.svg
    - .env
