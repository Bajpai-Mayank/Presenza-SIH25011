name: Build & Release Android APK

on:
  push:
    branches: [ "main", "feature/presenza-v2" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Verify Flutter SDK
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: touch .env
        
      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presenza-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Presenza Build
          body: |
            This is an automated build of the latest commit on the `main` branch.
            
            **Commit**: ${{ github.sha }}
            **Built at**: ${{ github.event.head_commit.timestamp || 'Manual Run' }}
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
