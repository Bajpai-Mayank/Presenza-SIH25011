name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select APK Build Type"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "release"
          - "debug"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Environment
        run: |
          java -version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure .env file exists
        run: touch .env

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      # Build Debug APK (if requested or on push)
      - name: Build Android Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch'
        run: flutter build apk --debug

      # Build Release APK (if requested or on push)
      - name: Build Android Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch'
        run: flutter build apk --release --no-tree-shake-icons

      # Prepare artifacts with clear filenames
      - name: Prepare APK binaries
        run: |
          mkdir -p dist
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk dist/Presenza-Debug.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/Presenza-Release.apk
          fi

      # Upload Debug Artifact
      - name: Upload Debug APK Artifact
        if: always() && hashFiles('dist/Presenza-Debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Presenza-Debug-APK
          path: dist/Presenza-Debug.apk
          retention-days: 14

      # Upload Release Artifact
      - name: Upload Release APK Artifact
        if: always() && hashFiles('dist/Presenza-Release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Presenza-Release-APK
          path: dist/Presenza-Release.apk
          retention-days: 30

      # Publish / Update GitHub Release on main push or version tag
      - name: Create or Update GitHub Release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Presenza Release {0}', github.ref_name) || 'Latest Presenza Build' }}
          body: |
            ## Presenza Automated Android Build 🚀
            
            - **Commit**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            - **Triggered by**: `${{ github.actor }}`
            
            ### Download APKs
            - **Release APK**: [Presenza-Release.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/Presenza-Release.apk)
            - **Debug APK**: [Presenza-Debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/Presenza-Debug.apk)
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/Presenza-Release.apk
            dist/Presenza-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
